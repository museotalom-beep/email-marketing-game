var(--text);padding:12px;border-radius:12px;margin:4px 0;border:1px solid transparent}.nav.active{background:#dcf2f3;border-color:#9cd4d6}.nav.done{color:var(--green)}.nav:disabled{opacity:.45}.main{min-height:610px}.hero{background:linear-gradient(120deg,#e7f7fb,#fff3df);padding:20px;border-radius:18px;margin-bottom:16px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:15px;background:#f5fbfd;border:1px solid var(--line);border-radius:15px}.tip{padding:12px 15px;background:#fff4de;border-left:4px solid #e5a33c;border-radius:9px;margin:12px 0}.feedback{margin:10px 0;padding:12px;border-radius:10px;background:#e8f8ed;color:#135737;font-weight:650}.feedback.bad{background:#fff0ef;color:var(--red)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.arena{position:relative;width:100%;height:380px;background:linear-gradient(135deg,#e2f7ff,#daf9e7);border:3px solid #80c9ce;border-radius:18px;overflow:hidden;touch-action:none}.arena:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff90 1px,transparent 1px),linear-gradient(90deg,#ffffff90 1px,transparent 1px);background-size:38px 38px;opacity:.35}.avatar,.token{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;z-index:1}.avatar{width:48px;height:48px;border-radius:50%;background:var(--coral);border:4px solid white;box-shadow:0 4px 12px #23556a50;font-size:27px;transition:left .07s linear,top .07s linear}.token{font-size:13px;font-weight:800;border-radius:999px;padding:10px 14px;border:2px solid white;background:#fff;box-shadow:0 3px 8px #17506830;white-space:nowrap}.token.good,.token.bad{background:#e1f1ff;border-color:#4388bd}.controls{display:grid;grid-template-columns:repeat(3,55px);justify-content:center;gap:5px;margin:10px auto}.controls button{padding:9px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3;grid-row:2}.progress{height:12px;border-radius:20px;background:#dceaf0;overflow:hidden;margin:8px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#35b9a1);transition:width .35s}.draggable{cursor:grab;user-select:none;padding:12px;border-radius:12px;border:2px solid #a6cbd6;background:white;font-weight:700;margin:5px;display:inline-block;touch-action:manipulation}.draggable.selected{border-color:var(--coral);background:#ffeedf}.dropzone{min-height:98px;padding:12px;border:2px dashed #77bbc7;border-radius:14px;background:#f5fcfe}.miniitem{display:inline-flex;padding:7px 10px;border-radius:10px;background:#e1f4f2;border:1px solid #b5d9d5;margin:4px;font-size:14px}.palette{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:45px;height:40px;border:3px solid white;box-shadow:0 0 0 1px #a9ccd4;border-radius:12px}.email{background:white;border:1px solid #cadae3;border-radius:18px;overflow:hidden;box-shadow:0 7px 20px #00000015}.email-head{background:#f0f6fa;padding:12px 15px;font-size:13px}.email-art{height:170px;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:900;text-align:center;padding:14px;position:relative;overflow:hidden}.email-art:after{content:'✦  ✧  ✦';position:absolute;font-size:50px;opacity:.25;bottom:-10px;right:10px;transform:rotate(-20deg);animation:float 4s ease-in-out infinite alternate}@keyframes float{to{transform:translate(-20px,-18px) rotate(15deg)}}.email-body{padding:20px;line-height:1.6}.email-cta{padding:12px 18px;display:inline-block;border-radius:8px;color:white;font-weight:800;text-decoration:none}.chartbars{display:flex;align-items:end;justify-content:space-around;height:240px;border-bottom:2px solid #92b5c0;gap:12px;padding:12px}.bar{flex:1;min-width:38px;max-width:90px;border-radius:9px 9px 0 0;background:linear-gradient(#5ac6ce,#00858c);position:relative;cursor:pointer;animation:rise .7s ease-out}. .campaign-copy{padding:14px 20px;font-size:14px;line-height:1.55}

</style></head><body><div class="shell"><header class="top"><div><div class="brand">✉️ Email Marketing Studio</div><div class="muted small">Interactive Team Simulation · Unit 11</div></div><div class="stats"><div class="stat">Time elapsed <b id="clock" class="num">00:00</b></div><div class="stat">Score <b id="score" class="num">0 / 120</b></div><div class="stat">Completion <b id="completion">0 / 6</b></div></div></header><div class="layout"><aside class="sidebar"><h3>Activity stages</h3><p class="muted small">Work together. Complete each interactive stage.</p><div id="nav"></div></aside><main class="panel main" id="app"></main></div></div>
<script>
'use strict';
const KEY='email_marketing_studio_v3';
const names=['Team Setup','Collect Marketing Terms','Subscriber Segmentation','Design the Email','Deliverability & Inbox','Campaign Analytics','Team Report'];
const targetSecs=1800;const maxStage=[0,20,20,30,20,30];
let S={stage:0,started:0,team:['',''],scores:{},done:{},logs:[],reflections:['','',''],arcade:{x:50,y:50,hits:[],seconds:0},buckets:{},studio:{},delivery:{},analytics:{},selected:null};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.started)S={...S,...old};}catch(e){}
let stageInterval=null,arenaInterval=null,arenaItems=[];let lastStep=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function elapsed(){return S.started?Math.floor((Date.now()-S.started)/1000):0}
function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function score(){return Object.values(S.scores).reduce((a,b)=>a+b,0)}
function head(){const c=$('clock');if(c)c.textContent=fmt(elapsed());$('score').textContent=score()+' / 120';$('completion').textContent=Object.keys(S.done).length+' / 5';}
function nav(){ $('nav').innerHTML=names.map((n,i)=>`<button class="nav ${S.stage===i?'active':''} ${S.done[i]?'done':''}" ${i>S.stage&&!S.done[i]?'disabled':''} onclick="go(${i})"><span>${S.done[i]?'✓':i===0?'◉':i}</span> ${esc(n)}</button>`).join('');}
function log(stage,action,detail){S.logs.push({stage:names[stage],action,detail,time:fmt(elapsed())});save()}
function putScore(stage,pts){const prior=S.scores[stage]||0;S.scores[stage]=Math.max(prior,Math.max(0,Math.min(maxStage[stage],Math.round(pts))));save();head()}
function finishStage(stage,pts){putScore(stage,pts);S.done[stage]=true;save();go(stage+1)}
function go(stage){if(stage>0&&!S.started)return; if(stage>1&&!S.done[stage-1]&&!S.done[stage])return;stopArena();S.stage=stage;S.selected=null;save();render()}
function stopArena(){if(arenaInterval){clearInterval(arenaInterval);arenaInterval=null}window.onkeydown=null}
function render(){nav();head();const app=$('app');app.innerHTML='';if(S.stage===0)setup(app);if(S.stage===1)arcade(app);if(S.stage===2)segment(app);if(S.stage===3)studio(app);if(S.stage===4)delivery(app);if(S.stage===5)analytics(app);if(S.stage===6)report(app)}
function intro(tag,title,desc){return `<div class="hero"><span class="pill">${tag}</span><h2 style="margin-top:10px">${title}</h2><div>${desc}</div></div>`}
function setup(app){app.innerHTML=intro('Welcome','Manage a Complete Email Campaign','Two students collaborate to build an email campaign, solve problems, and use campaign data to recommend improvements. There are no multiple-choice exams in this activity.')+`<div class="twocol"><div class="card"><h3>Team registration</h3><label>Student A name</label><input id="nameA" value="${esc(S.team[0])}" placeholder="Full name"><label>Student B name</label><input id="nameB" value="${esc(S.team[1])}" placeholder="Full name"><div class="actions"><button onclick="startGame()">Start team activity →</button></div></div><div class="card"><h3>Classroom requirements</h3><p>🕒 30 minutes minimum before a passing report can be issued</p><p>👥 Exactly two team members</p><p>🎯 At least <b>84 / 120 points (70%)</b></p><p>🧩 Complete all five interactive stages</p><p>📝 Both students explain their individual contributions</p><div class="tip small">Use one laptop. Student A leads the first and third activities; Student B leads the second and fourth. Both collaborate on analytics.</div></div></div>`}
function startGame(){const a=$('nameA').value.trim(),b=$('nameB').value.trim();if(!a||!b||a.toLowerCase()===b.toLowerCase()){alert('Enter two different student names.');return}S.team=[a,b];if(!S.started)S.started=Date.now();save();go(1)}
const terms=[['Opt-in',1],['SPF',1],['DKIM',1],['Unsubscribe',1],['Segmentation',1],['CTA',1],['Conversion',1],['A/B Test',1],['Hard Bounce',1],['Open Rate',1],['Engagement',1],['Landing Page',1],['Buy Email List',0],['Hide Unsubscribe',0],['Fake Discount',0],['Spam Everyone',0],['Broken Link',0],['Ignore Complaints',0]];
function arcade(app){app.innerHTML=intro('Stage 1 of 5 · 20 points','Collect Email Marketing Practices','Use arrow keys or WASD to move your marketing character. Collect responsible email marketing terms and avoid harmful practices. Discuss each item before you collect it.')+`<div class="kpis"><div class="kpi"><b id="hits">0</b><span>Correct collected</span></div><div class="kpi"><b id="mistakes">0</b><span>Incorrect collected</span></div><div class="kpi"><b id="arcTime">0s</b><span>Active movement</span></div></div><div class="collection-board"><h3>Collected marketing terms <span id="collectCount" class="pill">0 / 8 minimum</span></h3><div class="collection-instruction">All terms have the same appearance. Decide which practices are appropriate before collecting. Your collected terms remain visible here.</div><div class="collection-track" id="collectionTrack" aria-live="polite"><span class="muted">No terms collected yet.</span></div></div><div class="arena" id="arena" aria-label="Visible marketing terms collection field"><div class="avatar" id="avatar">🏃</div></div><div class="controls"><button class="up" onpointerdown="move(0,-5)">↑</button><button class="left" onpointerdown="move(-5,0)">←</button><button class="down" onpointerdown="move(0,5)">↓</button><button class="right" onpointerdown="move(5,0)">→</button></div><p class="muted small">Arrow keys/WASD on laptop, or use direction buttons. Correct items: +2. Wrong items: −2. Items respawn.</p><div id="arcFeedback" aria-live="polite"></div><div class="actions"><button onclick="completeArcade()">Complete collection →</button><button class="secondary" onclick="resetArcade()">Restart collection</button></div>`;arenaItems=[];for(let i=0;i<7;i++)spawn(i);setAvatar();refreshArc();window.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d','W','A','S','D'].includes(e.key)){e.preventDefault();let d=({'ArrowLeft':[-4,0],a:[-4,0],A:[-4,0],ArrowRight:[4,0],d:[4,0],D:[4,0],ArrowUp:[0,-5],w:[0,-5],W:[0,-5],ArrowDown:[0,5],s:[0,5],S:[0,5]})[e.key];move(...d)}};arenaInterval=setInterval(()=>{if(S.stage!==1)return;S.arcade.seconds++;$('arcTime').textContent=S.arcade.seconds+'s';if(S.arcade.seconds%4===0)save()},1000)}
function spawn(i){
 const existing=S.arcade.hits.map(x=>x.name);
 const onField=arenaItems.filter((x,j)=>j!==i&&x).map(x=>x.name);
 let choices=terms.filter(x=>!existing.includes(x[0])&&!onField.includes(x[0]));
 if(!choices.length)choices=terms.filter(x=>!onField.includes(x[0]));
 if(!choices.length)choices=terms;
 const t=choices[Math.floor(Math.random()*choices.length)];
 // Reserve space for readable labels. Avoid the avatar and other collection items.
 const field=$('arena'); const fw=field.clientWidth||780;const fh=field.clientHeight||465;
 const safeX=Math.max(12,Math.min(23,Math.ceil(93/fw*100)));
 const safeY=12;
 let x=50,y=50,found=false;
 for(let tries=0;tries<160;tries++){
  const cx=safeX+Math.random()*(100-2*safeX),cy=safeY+Math.random()*(100-2*safeY);
  const farFromAvatar=Math.abs((cx-S.arcade.x)*fw/100)>105||Math.abs((cy-S.arcade.y)*fh/100)>75;
  const farFromLabels=arenaItems.every((q,j)=>j===i||!q||Math.abs((cx-q.x)*fw/100)>167||Math.abs((cy-q.y)*fh/100)>62);
  if(farFromAvatar&&farFromLabels){x=cx;y=cy;found=true;break}
 }
 if(!found){ // Use a readable fixed grid position if random placement is crowded.
  const cells=[[17,18],[49,18],[81,18],[17,44],[81,44],[17,74],[49,74],[81,74],[49,43]];
  let spot=cells.find(([cx,cy])=>arenaItems.every((q,j)=>j===i||!q||Math.abs((cx-q.x)*fw/100)>135||Math.abs((cy-q.y)*fh/100)>53));
  if(spot){x=spot[0];y=spot[1]}
 }
 arenaItems[i]={name:t[0],good:!!t[1],x,y};
 const el=document.createElement('div');el.id='token'+i;el.className='token';el.textContent=t[0];el.style.left=x+'%';el.style.top=y+'%';field.appendChild(el)
}
function setAvatar(){const a=$('avatar');if(a){a.style.left=S.arcade.x+'%';a.style.top=S.arcade.y+'%'}}
function move(dx,dy){if(S.stage!==1)return;S.arcade.x=Math.min(96,Math.max(4,S.arcade.x+dx));S.arcade.y=Math.min(93,Math.max(7,S.arcade.y+dy));setAvatar();arenaItems.forEach((t,i)=>{if(t&&Math.abs(S.arcade.x-t.x)<9&&Math.abs(S.arcade.y-t.y)<10){S.arcade.hits.push({name:t.name,good:t.good});$('token'+i)?.remove();spawn(i);refreshArc();const f=$('arcFeedback');f.className='feedback'+(t.good?'':' bad');f.textContent=(t.good?'✓ Responsible marketing practice: ':'✕ Poor practice: ')+t.name;save()}})}
function refreshArc(){
 const good=S.arcade.hits.filter(x=>x.good).length,bad=S.arcade.hits.filter(x=>!x.good).length;
 $('hits').textContent=good;$('mistakes').textContent=bad;$('arcTime').textContent=S.arcade.seconds+'s';
 const unique=[...new Set(S.arcade.hits.filter(x=>x.good).map(x=>x.name))];
 if($('collectCount'))$('collectCount').textContent=unique.length+' / 8 minimum';
 if($('collectionTrack'))$('collectionTrack').innerHTML=unique.length?unique.map(x=>'<span class="collected-chip">✓ '+esc(x)+'</span>').join(''):'<span class="muted">No terms collected yet.</span>';
}
function resetArcade(){S.arcade={x:50,y:50,hits:[],seconds:0};save();render()}
function completeArcade(){const good=S.arcade.hits.filter(x=>x.good).length,bad=S.arcade.hits.filter(x=>!x.good).length,unique=new Set(S.arcade.hits.filter(x=>x.good).map(x=>x.name)).size;if(unique<8){alert('Collect at least eight DIFFERENT responsible marketing terms to continue. Currently: '+unique);return}let pts=Math.max(0,Math.min(20,unique*2-bad*2));log(1,'Marketing practice collection',`${unique} different correct terms; ${bad} incorrect selections. Collected: ${S.arcade.hits.map(x=>x.name).join(', ')}`);finishStage(1,pts)}
const subscribers=[{id:'a',title:'Confirmed newsletter subscriber',desc:'Clicked confirmation link yesterday',bucket:'send'},{id:'b',title:'Customer declined promotions',desc:'Purchased a product but unchecked marketing consent',bucket:'exclude'},{id:'c',title:'Subscriber requested unsubscribe',desc:'Opted out after last campaign',bucket:'exclude'},{id:'d',title:'Confirmed subscriber interested in new arrivals',desc:'Consent recorded; prefers monthly updates',bucket:'send'},{id:'e',title:'Imported contacts from an unverified list',desc:'No evidence of marketing permission',bucket:'review'},{id:'f',title:'Account holder only',desc:'Account created; no marketing consent recorded',bucket:'exclude'},{id:'g',title:'Former subscriber with repeated hard bounce',desc:'Address consistently rejected',bucket:'exclude'},{id:'h',title:'Signup pending confirmation',desc:'Double opt-in link not clicked yet',bucket:'review'}];
function segment(app){S.buckets=S.buckets||{};app.innerHTML=intro('Stage 2 of 5 · 20 points','Build a Permission-Based Audience','Student B leads. Drag customer cards into the appropriate campaign group. On touch devices, select a card and tap a destination. Not every contact should be emailed.')+`<div class="card"><h3>Subscriber cards</h3><div id="unsorted"></div></div><div class="threecol" style="margin-top:12px"><div class="dropzone" data-bucket="send" ondragover="event.preventDefault()" ondrop="dropSeg(event,'send')" onclick="tapBucket('send')"><h3>✅ Send</h3><p class="small muted">Permission-based active recipients</p><div id="sendItems"></div></div><div class="dropzone" data-bucket="review" ondragover="event.preventDefault()" ondrop="dropSeg(event,'review')" onclick="tapBucket('review')"><h3>🔎 Hold / verify</h3><p class="small muted">Check records before activation</p><div id="reviewItems"></div></div><div class="dropzone" data-bucket="exclude" ondragover="event.preventDefault()" ondrop="dropSeg(event,'exclude')" onclick="tapBucket('exclude')"><h3>⛔ Exclude</h3><p class="small muted">Do not send promotional emails</p><div id="excludeItems"></div></div></div><div class="actions"><button onclick="completeSeg()">Review segmentation →</button><button class="secondary" onclick="resetSeg()">Clear placement</button></div>`;drawSeg()}
function cardSeg(x){return `<div class="draggable ${S.selected===x.id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" onclick="event.stopPropagation();selectSeg('${x.id}')" style="max-width:260px"><b>${esc(x.title)}</b><div class="small muted" style="font-weight:400">${esc(x.desc)}</div></div>`}
function drawSeg(){for(const b of ['send','review','exclude'])$(b+'Items').innerHTML=subscribers.filter(x=>S.buckets[x.id]===b).map(cardSeg).join('');$('unsorted').innerHTML=subscribers.filter(x=>!S.buckets[x.id]).map(cardSeg).join('')||'<span class="muted">All cards placed.</span>'}
function selectSeg(id){S.selected=S.selected===id?null:id;drawSeg()}
function dropSeg(e,b){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(subscribers.find(x=>x.id===id)){S.buckets[id]=b;save();drawSeg()}}
function tapBucket(b){if(S.selected){S.buckets[S.selected]=b;S.selected=null;save();drawSeg()}}
function resetSeg(){S.buckets={};save();drawSeg()}
function completeSeg(){if(Object.keys(S.buckets).length<subscribers.length){alert('Place all eight subscriber cards first.');return}let correct=subscribers.filter(x=>S.buckets[x.id]===x.bucket).length;let pts=Math.round(correct/subscribers.length*20);log(2,'Audience segmentation',subscribers.map(x=>x.title+' → '+S.buckets[x.id]+(S.buckets[x.id]===x.bucket?' (appropriate)':' (needs review)')).join('; '));finishStage(2,pts)}

 <label>Subject line (18–65 characters)</label><input id="fsubject" maxlength="90" value="${esc(d.subject)}" oninput="setStudio('subject',this.value)">
 <label>Preheader text</label><input id="fpreheader" maxlength="130" value="${esc(d.preheader)}" oninput="setStudio('preheader',this.value)">
 <label>Email headline</label><input id="fheadline" maxlength="100" value="${esc(d.headline)}" oninput="setStudio('headline',this.value)">
 <label>Body copy — write your own marketing message</label><textarea id="fbody" oninput="setStudio('body',this.value)">${esc(d.body)}</textarea>
 <label>Call-to-action button text</label><input id="fcta" value="${esc(d.cta)}" oninput="setStudio('cta',this.value)">
 <label>CTA destination URL</label><input id="furl" value="${esc(d.url)}" oninput="setStudio('url',this.value)">
 <label>Target audience</label><select onchange="setStudio('audience',this.value)">${['Confirmed subscribers interested in new arrivals','Confirmed repeat customers','Confirmed seasonal-offer subscribers'].map(x=>`<option ${d.audience===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>Campaign objective</label><select onchange="setStudio('goal',this.value)">${['Website visits','Product discovery','Purchases','Customer retention'].map(x=>`<option ${d.goal===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>Permission / unsubscribe footer</label><textarea id="ffooter" oninput="setStudio('footer',this.value)">${esc(d.footer)}</textarea>
 </section>
 <section class="studio-pane"><div class="studio-tools"><h3>◫ Live email preview</h3><div class="studio-toggle"><button id="desktopView" class="active" onclick="switchStudioView('desktop')">▣ Desktop</button><button id="mobileView" onclick="switchStudioView('mobile')">▯ Mobile</button></div></div>
 <div class="studio-preview-wrap"><div id="studioFrame" class="preview-frame desktop"><div class="email" id="preview"></div></div></div>
 <div class="tip small">Write truthful promotional claims. Keep the CTA clear, check the link, and ensure the design works on mobile.</div>
 <div id="designChecks"></div>
 </section>
 <section class="studio-pane artoptions"><h3>▧ Design options</h3><p class="small muted">Select artwork to change the hero image in the actual email preview.</p>
 <div class="art-gallery">${art.map((a,i)=>`<button id="art${i}" class="art-option ${d.art===i?'selected':''}" onclick="setStudio('art',${i})"><img src="${a.src}" alt="${esc(a.name)} campaign artwork"><span>${esc(a.name)}</span></button>`).join('')}</div>
 <h3>Campaign colors</h3><div>${[['#007b84','Modern teal'],['#215996','Classic blue'],['#ab5b4b','Warm coral'],['#644e9a','Violet'],['#176c53','Natural green']].map(([c,n])=>`<button class="theme-option ${d.color===c?'active':''}" onclick="setStudio('color','${c}')"><span class="theme-dot" style="background:${c}"></span>${n}</button>`).join('')}</div>
 <h3 style="margin-top:17px">Email layout</h3><div class="palette"><button class="secondary" onclick="setStudio('layout',0)">Artwork-first</button><button class="secondary" onclick="setStudio('layout',1)">Headline-first</button></div>
 </section></div>
 <div class="actions"><button onclick="completeStudio()">Review design and continue →</button><button class="secondary" onclick="downloadEmail()">Download campaign email (HTML)</button></div>`;
 renderPreview();switchStudioView(studioView)
}
function switchStudioView(v){studioView=v;const f=$('studioFrame');if(f)f.className='preview-frame '+v;for(const x of ['desktop','mobile'])if($(x+'View'))$(x+'View').classList.toggle('active',x===v)}
function setStudio(k,v){S.studio[k]=v;save();renderPreview();if(k==='art')art.forEach((a,i)=>$('art'+i)?.classList.toggle('selected',i===v));if(k==='color')document.querySelectorAll('.theme-option').forEach(b=>b.classList.toggle('active',b.querySelector('.theme-dot')?.style.backgroundColor===v))}
function designCriteria(){const d=S.studio;return [!!d.brand.trim()&&d.brand.trim().length>=3,d.subject.trim().length>=18&&d.subject.trim().length<=65&&!/!!!|\$\$\$|90% off/i.test(d.subject),d.preheader.trim().length>=18,d.headline.trim().length>=12,d.body.trim().length>=70,d.cta.trim().length>=8&&d.cta.trim().length<=30,/^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(d.url)&&!/(bit\.ly|tinyurl)/i.test(d.url),/unsubscribe|opt.out/i.test(d.footer),!/(guarantee|100% free|click here!!!)/i.test(d.body),d.body.split(/\s+/).length>=12]}
function previewMarkup(){const d=S.studio,a=art[d.art]||art[0];const brand=`<div class="campaign-brand">✦ ${esc(d.brand)}</div>`;const hero=`<div class="campaign-hero ${d.art===0?'':'illustrated'}" style="background:${esc(d.color)}"><img src="${a.src}" alt="${esc(a.name)} campaign image"><div class="campaign-hero-copy"><h2>${esc(d.headline)}</h2><p>${esc(d.body.slice(0,110))}</p><a class="email-cta" style="background:${esc(d.color)};border:1px solid #ffffff65" href="#" onclick="event.preventDefault()">${esc(d.cta)} →</a></div></div>`;return `<div class="email-head"><b>From:</b> ${esc(d.brand)}<div><b>Subject:</b> ${esc(d.subject)}</div><span class="muted">${esc(d.preheader)}</span></div>${brand}${d.layout===1?`<div style="padding:8px 18px;text-align:center;color:${esc(d.color)};font-weight:800">${esc(d.headline)}</div>`:''}${hero}<div class="campaign-copy">${esc(d.body).replace(/\n/g,'<br>')}</div><div class="campaign-products"><div class="campaign-product"><div class="mini-art">✦</div><strong>New arrivals</strong></div><div class="campaign-product"><div class="mini-art">◈</div><strong>Featured collection</strong></div><div class="campaign-product"><div class="mini-art">❋</div><strong>Seasonal selection</strong></div></div><div class="campaign-footer">${esc(d.footer)}</div>`}
function renderPreview(){if($('preview'))$('preview').innerHTML=previewMarkup();if($('designChecks')){const tests=designCriteria(),n=tests.filter(Boolean).length;const q=[['Readability',tests.slice(1,5).filter(Boolean).length/4],['CTA & link',tests.slice(5,7).filter(Boolean).length/2],['Campaign quality',n/10]];$('designChecks').innerHTML='<h3 style="margin-top:14px">Campaign feedback</h3><div class="studio-quality">'+q.map(([name,val])=>`<div class="q">${name}<b>${Math.round(val*100)}%</b><div class="progress"><span style="width:${Math.round(val*100)}%"></span></div></div>`).join('')+'</div><p class="small muted">'+n+' of 10 content checks satisfied. Scores are based on content checks; artwork preferences alone do not guarantee performance.</p>'}}
function completeStudio(){const valid=designCriteria().filter(Boolean).length;const d=S.studio;const txt='Subject: '+d.subject+'; heading: '+d.headline+'; body: '+d.body+'; CTA: '+d.cta+'; URL: '+d.url+'; artwork: '+art[d.art].name+'; audience: '+d.audience+'; objective: '+d.goal+'; footer: '+d.footer;log(3,'Email creative produced',txt);finishStage(3,Math.round(valid*3))}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadEmail(){downloadFile('team-email-design.html','<!doctype html><html><meta charset="utf-8"><title>Team Email</title>'+previewMarkup()+'</html>','text/html')}
const mailItems=[{id:'m1',title:'Promotion from a recognized brand',desc:'Subscription confirmed, valid sender, offer message',dest:'promotions'},{id:'m2',title:'Personal message from a colleague',desc:'Conversational message between people',dest:'primary'},{id:'m3',title:'Unwanted suspicious promotion',desc:'Unrecognized sender, misleading links and no permission',dest:'spam'},{id:'m4',title:'Seasonal collection newsletter',desc:'Permission-based commercial announcement',dest:'promotions'},{id:'m5',title:'Invoice conversation',desc:'Expected one-to-one communication',dest:'primary'},{id:'m6',title:'Deceptive urgent prize claim',desc:'Unsolicited message and suspicious destination',dest:'spam'}];
function delivery(app){S.delivery=S.delivery||{};app.innerHTML=intro('Stage 4 of 5 · 20 points','Delivery Quality and Inbox Classification','Student B leads. Configure responsible sending, then sort incoming messages into likely inbox categories. Inbox placement is probabilistic; these are simplified learning examples, not guarantees.')+`<div class="twocol"><div class="card"><h3>Sending configuration</h3><p class="small muted">Activate essential protections before sending.</p>${[['spf','SPF: authorized sending servers'],['dkim','DKIM: signed email authenticity'],['dmarc','DMARC: alignment and domain policy'],['consent','Permission-based audience'],['unsub','Visible working unsubscribe'],['links','Tested and trustworthy links']].map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center"><input style="width:20px" type="checkbox" ${S.delivery[k]?'checked':''} onchange="S.delivery['${k}']=this.checked;save()"> ${l}</label>`).join('')}</div><div class="card"><h3>Inbox sorting</h3><div class="card" id="mailPool"></div><div class="threecol" style="margin-top:12px">${['primary','promotions','spam'].map(b=>`<div class="dropzone" ondragover="event.preventDefault()" ondrop="dropMail(event,'${b}')" onclick="tapMail('${b}')"><b>${b==='primary'?'Primary':b==='promotions'?'Promotions':'Spam'}</b><div id="mail_${b}"></div></div>`).join('')}</div></div></div><div class="actions"><button onclick="completeDelivery()">Review delivery plan →</button></div>`;drawMail()}
function drawMail(){if(!$('mailPool'))return;$('mailPool').innerHTML=mailItems.filter(x=>!S.delivery['mail_'+x.id]).map(x=>`<div class="draggable ${S.selected===x.id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" onclick="event.stopPropagation();selectMail('${x.id}')">✉ ${esc(x.title)}<div class="small muted" style="font-weight:400">${esc(x.desc)}</div></div>`).join('');for(let b of ['primary','promotions','spam'])$('mail_'+b).innerHTML=mailItems.filter(x=>S.delivery['mail_'+x.id]===b).map(x=>`<div class="miniitem" onclick="event.stopPropagation();S.delivery['mail_${x.id}']=null;save();drawMail()">${esc(x.title)} ×</div>`).join('')}
function selectMail(id){S.selected=S.selected===id?null:id;drawMail()}
function dropMail(e,b){e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(mailItems.some(x=>x.id===id)){S.delivery['mail_'+id]=b;save();drawMail()}}
function tapMail(b){if(S.selected){S.delivery['mail_'+S.selected]=b;S.selected=null;save();drawMail()}}
function completeDelivery(){if(mailItems.some(x=>!S.delivery['mail_'+x.id])){alert('Sort all six message cards first.');return}const checks=['spf','dkim','dmarc','consent','unsub','links'].filter(k=>S.delivery[k]).length,correct=mailItems.filter(x=>S.delivery['mail_'+x.id]===x.dest).length,pts=Math.round(checks/6*8+correct/6*12);log(4,'Sending configuration',`Controls enabled ${checks}/6; inbox sorting ${correct}/6; `+mailItems.map(x=>x.title+' → '+S.delivery['mail_'+x.id]).join('; '));finishStage(4,pts)}
const campaigns=[{name:'Campaign A',delivered:6000,clicks:540,orders:54,complaints:5},{name:'Campaign B',delivered:8000,clicks:400,orders:72,complaints:38},{name:'Campaign C',delivered:5000,clicks:600,orders:48,complaints:3},{name:'Campaign D',delivered:7000,clicks:350,orders:70,complaints:7}];
function analytics(app){S.analytics=S.analytics||{};let m=S.analytics;app.innerHTML=intro('Stage 5 of 5 · 30 points','Analyze Campaign Results and Recommend Improvements','Use campaign data to calculate performance, compare outcomes, and choose operational improvements. Click a chart bar to inspect the campaign. Your analysis must use the evidence, not only the largest number.')+`<div class="kpis">${campaigns.map(c=>`<div class="kpi"><b>${c.name.split(' ')[1]}</b><span>${c.delivered.toLocaleString()} delivered</span></div>`).join('')}</div><div class="twocol" style="margin-top:14px"><div class="card"><h3>Interactive performance chart</h3><p class="small muted">Unique clicks by campaign — select a bar.</p><div class="chartbars">${campaigns.map((c,i)=>`<div class="bar" style="height:${c.clicks/650*100}%" onclick="selectCampaign(${i})" title="${c.name}: ${c.clicks} clicks"><span>${c.clicks}</span></div>`).join('')}</div><div class="kpis">${campaigns.map(c=>`<div class="kpi small">${c.name.split(' ')[1]}</div>`).join('')}</div><div id="selectedCampaign" class="tip">Select a bar to inspect delivery, clicks, orders, and complaints.</div></div><div class="card"><h3>Analytics worksheet</h3><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr><th>Campaign</th><th>Delivered</th><th>Unique clicks</th><th>Orders</th><th>Complaints</th></tr></thead><tbody>${campaigns.map(c=>`<tr style="border-top:1px solid #c8dfe5"><td>${c.name}</td><td>${c.delivered}</td><td>${c.clicks}</td><td>${c.orders}</td><td>${c.complaints}</td></tr>`).join('')}</tbody></table><label>Campaign A click-through rate (%)</label><input id="ctrA" type="number" min="0" max="100" step=".01" value="${esc(m.ctrA||'')}" oninput="S.analytics.ctrA=this.value;save()"><label>Campaign C click-through rate (%)</label><input id="ctrC" type="number" min="0" max="100" step=".01" value="${esc(m.ctrC||'')}" oninput="S.analytics.ctrC=this.value;save()"><label>Campaign B order conversion rate (%) — orders ÷ clicks</label><input id="convB" type="number" min="0" max="100" step=".01" value="${esc(m.convB||'')}" oninput="S.analytics.convB=this.value;save()"><label>Which campaign has the highest click-through rate?</label><select id="bestCtr" onchange="S.analytics.bestCtr=this.value;save()"><option value="">Select campaign</option>${campaigns.map(c=>`<option ${m.bestCtr===c.name?'selected':''}>${c.name}</option>`).join('')}</select></div></div><div class="card" style="margin-top:14px"><h3>Marketing improvement plan</h3><p>Assign each operational action to the problem it best addresses.</p><div id="planPool"></div><div class="threecol">${[['complaints','High spam complaints'],['clicks','Low click rate'],['bounces','Invalid addresses']].map(([k,v])=>`<div class="dropzone" ondragover="event.preventDefault()" ondrop="dropPlan(event,'${k}')" onclick="tapPlan('${k}')"><b>${v}</b><div id="plan_${k}"></div></div>`).join('')}</div><label>Write a data-based recommendation (at least 80 characters)</label><textarea id="recommend" oninput="S.analytics.recommend=this.value;save()" placeholder="Refer to campaign metrics, customer trust, and what you would change next.">${esc(m.recommend||'')}</textarea></div><div class="actions"><button onclick="completeAnalytics()">Finish analytics and prepare report →</button></div>`;drawPlan();if(m.inspect!=null)selectCampaign(m.inspect)}
function selectCampaign(i){S.analytics.inspect=i;save();let c=campaigns[i];$('selectedCampaign').innerHTML=`<b>${c.name}</b>: ${c.delivered.toLocaleString()} delivered · ${c.clicks} clicks · ${c.orders} orders · ${c.complaints} complaints<br><b>CTR:</b> ${(100*c.clicks/c.delivered).toFixed(1)}% · <b>Order conversion from clicks:</b> ${(100*c.orders/c.clicks).toFixed(1)}%`}
const planActions=[{id:'p1',label:'Improve consent and sending frequency',dest:'complaints'},{id:'p2',label:'Test clearer CTA and audience relevance',dest:'clicks'},{id:'p3',label:'Suppress hard-bounced addresses',dest:'bounces'}];
function drawPlan(){const a=S.analytics;$('planPool').innerHTML=planActions.filter(p=>!a['plan_'+p.id]).map(p=>`<div class="draggable ${S.selected===p.id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${p.id}')" onclick="selectPlan('${p.id}')">${esc(p.label)}</div>`).join('');for(let k of ['complaints','clicks','bounces'])$('plan_'+k).innerHTML=planActions.filter(p=>a['plan_'+p.id]===k).map(p=>`<span class="miniitem" onclick="event.stopPropagation();S.analytics['plan_${p.id}']=null;save();drawPlan()">${esc(p.label)} ×</span>`).join('')}
function selectPlan(id){S.selected=S.selected===id?null:id;drawPlan()}
function dropPlan(e,k){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(planActions.some(p=>p.id===id)){S.analytics['plan_'+id]=k;save();drawPlan()}}
function tapPlan(k){if(S.selected){S.analytics['plan_'+S.selected]=k;S.selected=null;save();drawPlan()}}
function completeAnalytics(){const m=S.analytics;if(planActions.some(p=>!m['plan_'+p.id])){alert('Place all three improvement actions first.');return}if((m.recommend||'').trim().length<80){alert('Write a data-based recommendation of at least 80 characters.');return}let correct=0;if(Math.abs(Number(m.ctrA)-9)<.11)correct++;if(Math.abs(Number(m.ctrC)-12)<.11)correct++;if(Math.abs(Number(m.convB)-18)<.11)correct++;if(m.bestCtr==='Campaign C')correct++;let sorted=planActions.filter(p=>m['plan_'+p.id]===p.dest).length;let pts=Math.round(correct/4*18+sorted/3*9+((m.recommend||'').trim().length>=120?3:1));log(5,'Campaign analysis',`CTR A: ${m.ctrA}%; CTR C: ${m.ctrC}%; conversion B: ${m.convB}%; highest CTR: ${m.bestCtr}; improvement assignments: ${planActions.map(p=>p.label+' → '+m['plan_'+p.id]).join(', ')}; recommendation: ${m.recommend}`);finishStage(5,pts)}
function report(app){const sc=score(),time=elapsed(),pass=sc>=84&&time>=targetSecs&&[1,2,3,4,5].every(x=>S.done[x]);app.classList.add('printme');app.innerHTML=intro('Team activity report','Email Marketing — Results and Reflection','Review the team’s decisions and submit the report to the instructor. A pass requires all stages, at least 70% and at least 30 minutes elapsed.')+`<div class="kpis"><div class="kpi"><b>${sc}/120</b>Team points</div><div class="kpi"><b>${Math.round(sc/120*100)}%</b>Final score</div><div class="kpi"><b id="reportTime">${fmt(time)}</b>Elapsed time</div><div class="kpi"><b>${pass?'PASS':sc>=84?'TIME REMAINING':'BELOW 70%'}</b>Completion status</div></div><div class="card" style="margin-top:15px"><h3>Stage performance</h3>${[1,2,3,4,5].map(i=>`<div style="display:flex;justify-content:space-between;margin:12px 0"><span>${names[i]}</span><b>${S.scores[i]||0} / ${maxStage[i]}</b></div><div class="progress"><span style="width:${(S.scores[i]||0)/maxStage[i]*100}%"></span></div>`).join('')}</div><div class="twocol" style="margin-top:15px"><div class="card"><h3>Student A — contributions</h3><p class="small muted">Explain the actions you performed, a decision, and why it mattered (minimum 120 characters).</p><textarea id="rA" oninput="S.reflections[0]=this.value;save()">${esc(S.reflections[0])}</textarea></div><div class="card"><h3>Student B — contributions</h3><p class="small muted">Explain your actions, a decision, and what you learned (minimum 120 characters).</p><textarea id="rB" oninput="S.reflections[1]=this.value;save()">${esc(S.reflections[1])}</textarea></div></div><div class="card" style="margin-top:15px"><h3>Joint marketing recommendation</h3><textarea id="rJoint" oninput="S.reflections[2]=this.value;save()" placeholder="Summarize improvements based on the team's actual campaign results (minimum 120 characters)">${esc(S.reflections[2])}</textarea></div><div id="reportHint" class="tip">${pass?'Passing score and time requirements met. Complete reflections to export.':sc<84?'Score is below 70%. Return to stages and improve your work.':'30 minutes have not yet elapsed. Review your work and discuss the reflections while the timer continues.'}</div><div class="actions"><button onclick="exportReport()">Download team report</button><button class="secondary" onclick="window.print()">Print report</button><button class="secondary" onclick="go(3)">Revisit email design</button><button class="secondary" onclick="go(5)">Revisit analytics</button></div><details style="margin-top:17px"><summary style="cursor:pointer;font-weight:700">Instructor review: activity decision log</summary><div class="team-report">${S.logs.map(l=>`<p><b>${esc(l.time)} — ${esc(l.stage)}</b><br>${esc(l.detail)}</p>`).join('')}</div></details>`}
function reportText(){const sc=score();return `EMAIL MARKETING STUDIO — TEAM ACTIVITY REPORT\nStudent A: ${S.team[0]}\nStudent B: ${S.team[1]}\nElapsed: ${fmt(elapsed())}\nScore: ${sc}/120 (${Math.round(sc/120*100)}%)\nStatus: ${sc>=84&&elapsed()>=1800&&[1,2,3,4,5].every(x=>S.done[x])?'PASS':'NOT YET PASSED'}\n\nSTAGES\n${[1,2,3,4,5].map(i=>names[i]+': '+(S.scores[i]||0)+'/'+maxStage[i]).join('\n')}\n\nSTUDENT A\n${S.reflections[0]}\n\nSTUDENT B\n${S.reflections[1]}\n\nJOINT RECOMMENDATION\n${S.reflections[2]}\n\nEMAIL DESIGN\n${JSON.stringify(S.studio,null,2)}\n\nACTIVITY LOG\n${S.logs.map(l=>'['+l.time+'] '+l.stage+': '+l.detail).join('\n\n')}\n`}
function exportReport(){const sc=score(),time=elapsed();if(![1,2,3,4,5].every(x=>S.done[x])){alert('All stages must be completed.');return}if(sc<84){alert('The team needs at least 84/120 points to pass. Revisit activities to improve.');return}if(time<1800){alert('A passing report becomes available after 30 minutes elapsed. Time remaining: '+fmt(1800-time));return}if(S.reflections.some(s=>s.trim().length<120)){alert('Student A, Student B, and joint reflections must each contain at least 120 characters.');return}downloadFile('Email_Marketing_Team_'+S.team.map(s=>s.replace(/[^a-z0-9]/gi,'_')).join('_')+'.txt',reportText(),'text/plain;charset=utf-8')}
setInterval(()=>{head();if(S.stage===6&&$('reportTime')){$('reportTime').textContent=fmt(elapsed())}},1000);
render();
</script></body></html>
